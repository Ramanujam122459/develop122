name: AI Multi-Agent Performance Test

on:
  workflow_dispatch:

jobs:
  performance-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # Check Repository Structure
      # ==========================================
      - name: Check Repository Structure
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Directory structure:"
          find . -maxdepth 2 -type f

      # ==========================================
      # Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # Install Python Dependencies
      # ==========================================
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ==========================================
      # Download Copilot Runtime
      # ==========================================
      - name: Download Copilot Runtime
        run: |
          python -m copilot download-runtime

      # ==========================================
      # Install k6
      # ==========================================
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # ==========================================
      # Verify Environment
      # ==========================================
      - name: Verify Environment
        run: |
          python --version
          k6 version

      # ==========================================
      # Run AI Multi-Agent Performance Test
      # ==========================================
      - name: Run AI Multi-Agent Performance Test
        run: |
          python main.py
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      # ==========================================
      # Upload Performance Results
      # ==========================================
      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: |
            results/
            reports/
            k6/generated_test.js
          if-no-files-found: warn
          retention-days: 7
