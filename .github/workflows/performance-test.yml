name: AI Multi-Agent Performance Test

on:
  workflow_dispatch:

jobs:
  performance-test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: performance-multi-agent

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Copilot Runtime
        run: |
          python -m copilot download-runtime

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify Environment
        run: |
          python --version
          k6 version

      - name: Run AI Multi-Agent Performance Test
        run: |
          python main.py
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: |
            performance-multi-agent/results/
            performance-multi-agent/reports/
            performance-multi-agent/k6/generated_test.js
          retention-days: 7
